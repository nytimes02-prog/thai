<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7259">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ล่าม 한·태 자동 통역</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first column — header, scrolling conversation, control dock pinned at the bottom. */
:root {
  --bg: #EFF4F1; --surface: #FFFFFF; --surface-2: #E3ECE7; --ink: #14211D; --muted: #5A6B65; --line: #D2DED8;
  --jade: #0B7259; --jade-ink: #FFFFFF; --jade-soft: #D8EEE6;
  --pink: #C93370; --pink-soft: #FBE3EC; --pink-ink: #5C1231;
  --warn-bg: #FFF2CF; --warn-ink: #6E4B00; --bad: #B3261E;
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-thai: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  --f-ko: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1513; --surface: #16201D; --surface-2: #1E2B27; --ink: #E4EDEA; --muted: #92A59F; --line: #2A3934;
  --jade: #3DC49E; --jade-ink: #052019; --jade-soft: #173A30;
  --pink: #F06C9F; --pink-soft: #3A1B28; --pink-ink: #FFD6E5;
  --warn-bg: #3A2E0E; --warn-ink: #F5D27A; --bad: #FF8A80; color-scheme: dark;
} }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-ko); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
[lang="th"] { font-family: var(--f-thai); }
#app { height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); width: 100%; }
header { background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
.bar { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.brand { margin-right: auto; display: flex; align-items: baseline; gap: 8px; }
.brand b { font-family: var(--f-display); font-size: 22px; color: var(--jade); }
.brand span { color: var(--muted); font-size: 13px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-width: 38px; height: 38px; padding: 0 10px; display: grid; place-items: center; }
.icon-btn[aria-pressed="true"] { background: var(--jade); color: var(--jade-ink); border-color: var(--jade); }
main { flex: 1; overflow-y: auto; }
.list { display: flex; flex-direction: column; gap: 12px; padding-block: 16px 24px; }
.empty { color: var(--muted); text-align: center; padding: 32px 8px; }
.empty b { color: var(--ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.card.th { border-left: 4px solid var(--pink); }
.card.ko { border-left: 4px solid var(--jade); }
.card .dir { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.card .heard { color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
.card .out { font-size: 22px; font-weight: 600; line-height: 1.4; margin-top: 4px; overflow-wrap: anywhere; }
.card .out[lang="th"] { font-size: 24px; }
.card .read { font-size: 13px; color: var(--muted); margin-top: 2px; }
.card .read b { color: var(--pink); font-weight: 600; }
.card .note { font-size: 13px; background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 4px 8px; margin-top: 6px; }
.card .acts { display: flex; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 12px; font-size: 13px; }
.card.pending .out { color: var(--muted); font-size: 16px; font-weight: 500; }
.dock { flex: none; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
.status { display: flex; align-items: center; gap: 10px; padding-top: 10px; min-height: 34px; }
.status .txt { flex: 1; font-size: 14px; }
.status .txt b { color: var(--jade); }
.meter { width: 70px; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; flex: none; }
.meter i { display: block; height: 100%; width: 0; background: var(--jade); border-radius: 99px; transition: width .08s linear; }
.seg { display: flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 3px; margin-top: 8px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 6px 8px; font-size: 14px; font-weight: 500; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--jade); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.big { display: flex; gap: 10px; margin-top: 10px; }
.big button { flex: 1; min-height: 64px; border-radius: 16px; border: 0; font-size: 18px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.25; }
.big button small { font-size: 12px; font-weight: 400; opacity: .85; }
.go { background: var(--jade); color: var(--jade-ink); }
.go.on { background: var(--pink); color: #fff; }
.b-ko { background: var(--jade); color: var(--jade-ink); }
.b-th { background: var(--pink); color: #fff; }
.big button.live { box-shadow: 0 0 0 4px var(--warn-bg), 0 0 0 6px var(--warn-ink); }
.typing { display: flex; gap: 8px; margin-top: 10px; }
.typing input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 9px 12px; }
.typing button { border: 0; background: var(--surface-2); border-radius: 12px; padding: 0 14px; font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-size: 17px; margin: 0; }
.panel ol { margin: 0; padding-left: 20px; }
.panel label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.panel select, .panel input[type=password], .panel input[type=text] { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row input { flex: 1; min-width: 180px; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 14px; font-weight: 500; }
.btn.primary { background: var(--jade); color: var(--jade-ink); border-color: var(--jade); }
.help { font-size: 13px; color: var(--muted); }
.ok { font-size: 13px; color: var(--jade); }
.bad { font-size: 13px; color: var(--bad); }
a { color: var(--jade); }
#show { position: fixed; inset: 0; background: var(--surface); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 16px; }
#show .t { font-size: clamp(30px, 8vw, 56px); font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
#show .s { color: var(--muted); font-size: 18px; }
#show .x { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: 16px; }
.toast { position: fixed; left: 50%; bottom: 200px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; z-index: 60; max-width: 90vw; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <header><div class="wrap bar">
    <div class="brand"><b>ล่าม</b><span>한국어 ⇄ ภาษาไทย 자동 통역</span></div>
    <button class="icon-btn" id="btnSet" aria-pressed="false" title="설정">설정</button>
  </div></header>
  <main id="main"><div class="wrap">
    <section id="setup" class="panel" hidden></section>
    <section id="settings" class="panel" hidden></section>
    <div class="list" id="list"></div>
  </div></main>
  <div class="dock"><div class="wrap">
    <div class="status"><div class="txt" id="status">시작을 누르면 듣기 시작해요</div><button class="chip" id="calBtn" type="button" title="TV 소리 크기를 재서 그보다 큰 목소리만 들어요">주변 소리 재기</button><div class="meter" aria-hidden="true"><i id="meter"></i></div></div>
    <div class="seg" role="tablist">
      <button role="tab" id="mAuto" aria-selected="true">자동 감지</button>
      <button role="tab" id="mBtn" aria-selected="false">눌러서 말하기</button>
    </div>
    <div class="big" id="autoCtl"><button class="go" id="go">시작<small>한국어든 태국어든 그냥 말하세요</small></button></div>
    <div class="big" id="btnCtl" hidden>
      <button class="b-ko" id="sayKo">한국어로 말하기<small>태국어로 바꿔 읽어 줘요</small></button>
      <button class="b-th" id="sayTh" lang="th">พูดภาษาไทย<small lang="ko">한국어로 바꿔 읽어 줘요</small></button>
    </div>
    <form class="typing" id="typeForm"><input id="typeIn" placeholder="글로 쓰기 (한국어 또는 태국어)" autocomplete="off" enterkeyhint="send"><button type="submit">번역</button></form>
  </div></div>
</div>
<div id="show" hidden role="dialog" aria-modal="true" aria-label="크게 보기"><button class="btn x" id="showX">닫기</button><div class="t" id="showT"></div><div class="s" id="showS"></div></div>
<script>
"use strict";
// ---------- small helpers ----------
const $ = (id) => document.getElementById(id);
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : String(c));
  return n;
}
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
let toastTimer;
function toast(msg) { document.querySelector(".toast")?.remove(); const t = el("div", { class: "toast", role: "status", text: msg }); document.body.append(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3500); }
const isThai = (s) => /[฀-๿]/.test(s);

// ---------- state ----------
// the Gemini key and model list are shared with the free conversation page (same keys in this browser)
let apiKey = lsGet("thai.gemini.key", "");
let models = lsGet("thai.gemini.models", []);
const settings = Object.assign({ model: "", gender: "m", sens: "mid", silence: 900, rate: 0.9, mode: "auto", showReading: true }, lsGet("interp.settings", {}));
const saveSettings = () => lsSet("interp.settings", settings);
if (settings.modelPick !== 2) { settings.model = ""; settings.modelPick = 2; saveSettings(); }   // 11/19: drop the old default (gemini-flash-latest hung); the fast lite model is chosen below
let log = lsGet("interp.log", []);
const saveLog = () => { log = log.slice(-80); lsSet("interp.log", log); };

// ---------- Gemini (free tier) ----------
const API = "https://generativelanguage.googleapis.com/v1beta";
async function apiError(r) {
  let j = null; try { j = await r.json(); } catch {}
  const m = j?.error?.message || "";
  if (r.status === 400 && /api key/i.test(m)) return { code: "key", msg: "키가 맞지 않아요. 설정에서 키를 다시 넣어 주세요." };
  if (r.status === 400) return { code: "bad", msg: m };
  if (r.status === 403) return { code: "key", msg: "이 키로는 쓸 수 없어요. AI Studio에서 새 키를 만들어 보세요." };
  if (r.status === 429) return { code: "quota", msg: "무료 사용 한도에 걸렸어요. 1분쯤 뒤에 다시 하거나, 설정에서 'lite' 모델로 바꿔 보세요." };
  if (r.status === 404) return { code: "model", msg: "선택한 모델을 찾지 못했어요." };
  if (r.status >= 500) return { code: "busy", msg: "구글 AI 서버가 바빠요. 잠시 뒤 다시 말해 주세요." };
  return { code: "error", msg: "통역 결과를 받지 못했어요. 다시 말해 주세요." };
}
async function listModels(key) {
  let r;
  try { r = await fetch(API + "/models?pageSize=200", { headers: { "x-goog-api-key": key } }); } catch { throw { msg: "인터넷 연결을 확인해 주세요." }; }
  if (!r.ok) throw await apiError(r);
  const j = await r.json();
  return (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
    .map(m => String(m.name).replace(/^models\//, ""))
    .filter(n => /^gemini/.test(n) && /flash/.test(n) && !/(image|tts|audio|live|embed|robotics|computer|thinking-exp)/.test(n));
}
// 11/19 test with the user's free key: gemini-flash-latest hung for 30 s+ and the newest full flash answered "high demand" (503),
// while gemini-3.5-flash-lite answered in about 1 s. For live interpreting a fast "lite" model comes first; the rest are fallbacks.
function rankModels(list) {
  const ver = (n) => parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || "0");
  const score = (n) => (/lite/.test(n) ? 1000 : 0) + ver(n) * 100 + (/latest/.test(n) ? 40 : 0) - (/(preview|exp)/.test(n) ? 300 : 0) - (/omni/.test(n) ? 500 : 0);
  return [...list].sort((a, b) => score(b) - score(a));
}
function defaultModel(list) { return rankModels(list)[0] || "gemini-flash-lite-latest"; }
function parseJSON(text) {
  const t = text.trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "");
  try { return JSON.parse(t); } catch {}
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch {} }
  throw { code: "json", msg: "통역 결과를 읽지 못했어요. 다시 말해 주세요." };
}
// One request to one model, given up after 20 s (an overloaded model can hang far longer than that).
async function callModel(model, system, parts) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 20000);
  try {
    const r = await fetch(`${API}/models/${encodeURIComponent(model)}:generateContent`, {
      method: "POST", signal: ctl.signal, headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
      // no thinkingConfig: some models answer 400 "invalid argument" to it, and the lite models are quick without it
      body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: [{ role: "user", parts }], generationConfig: { responseMimeType: "application/json", temperature: 0.2 } }),
    });
    if (!r.ok) throw await apiError(r);
    return await r.json();
  } catch (e) {
    if (e?.name === "AbortError") throw { code: "slow", msg: "AI 서버가 너무 느려요. 잠시 뒤 다시 말해 주세요." };
    if (e?.code) throw e;
    throw { code: "net", msg: "인터넷 연결을 확인해 주세요." };
  } finally { clearTimeout(timer); }
}
// Tries the chosen model first, then the next best ones: a busy, slow, retired or over-quota model moves on to another
// (each model has its own free quota). The model that answered becomes the one used next time.
async function gemini(system, parts) {
  const order = [...new Set([settings.model, ...rankModels(models)].filter(Boolean))].slice(0, 5);
  if (!order.length) order.push("gemini-flash-lite-latest");
  let last = null, j = null;
  for (const m of order) {
    try { j = await callModel(m, system, parts); if (settings.model !== m) { settings.model = m; saveSettings(); } break; }
    catch (e) {
      last = e;
      if (e.code === "key" || e.code === "net") throw e;   // another model would not help
      if (e.code === "model") { models = models.filter(x => x !== m); lsSet("thai.gemini.models", models); }
    }
  }
  if (!j) {
    if (last?.code === "bad") last.msg = "통역 요청이 거절됐어요. 다시 말해 주세요.";
    throw last || { code: "error", msg: "통역 결과를 받지 못했어요. 다시 말해 주세요." };
  }
  const text = (j.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || "").join("");
  if (!text) throw { code: "blocked", msg: "이 말은 통역 결과를 받지 못했어요." };
  return parseJSON(text);
}
function systemPrompt() {
  const me = settings.gender === "f" ? "female (use ค่ะ / คะ)" : "male (use ครับ)";
  return `You are a live interpreter between Korean and Thai. The user is a Korean traveler (${me}) talking face to face with Thai people; both sides speak into the same phone.
For each input (an audio clip or a typed text):
1. Decide the language: "ko" (Korean) or "th" (Thai). If the audio is silence, noise, unclear, or another language, return lang "none" and leave the other fields empty.
   The phone is in a room that may have a TV, radio, video or other people talking in the background. Interpret only a person speaking close to the phone, addressing the other person.
   If the clip is mainly background media or distant voices (TV-like sound: music, announcer or drama voices, laughter tracks, ads, far-away chatter), return lang "none".${settings.sens === "near" ? " Be strict: when unsure whether the voice is close to the phone, return \"none\"." : ""}
2. heard: exactly what was said, in its own script (Hangul for Korean, Thai script for Thai). Do not translate here.
3. translation: what a native speaker would naturally say in the other language.
   Korean → Thai: polite everyday spoken Thai; end with the right polite particle for the user's gender where natural.
   Thai → Korean: natural polite Korean (해요체).
   Keep names, numbers, prices, times and places exact (write numbers as Arabic digits). No explanations inside the translation.
4. For the Thai sentence (heard when lang is "th", translation when lang is "ko"):
   th_roman: easy romanization with tone marks (Paiboon style, e.g. "sà-wàt-dii khráp");
   th_hangul: Hangul pronunciation guide a Korean can read aloud (keep aspiration distinct: ก=ㄲ, ค=ㅋ, ต=ㄸ, ท=ㅌ, ป=ㅃ, พ=ㅍ).
5. note: a very short Korean note only if something is ambiguous or culturally important (e.g. a price that sounds too high, a polite form to use); otherwise "".
Answer with JSON only: {"lang":"ko|th|none","heard":"","translation":"","th_roman":"","th_hangul":"","note":""}`;
}
function contextText() {
  const recent = log.slice(-4).map(x => `${x.lang === "ko" ? "Korean" : "Thai"}: ${x.heard} => ${x.translation}`).join("\n");
  return recent ? `Recent conversation (for context only):\n${recent}\n\n` : "";
}

// ---------- speech out (browser voices, free) ----------
const canSpeak = "speechSynthesis" in window;
let thVoice = null, koVoice = null;
function pickVoices() {
  if (!canSpeak) return;
  const vs = speechSynthesis.getVoices();
  const best = (re) => { const c = vs.filter(v => re.test(v.lang)); return c.find(v => /google|premium|enhanced|natural|online/i.test(v.name)) || c[0] || null; };
  thVoice = best(/^th([-_]|$)/i); koVoice = best(/^ko([-_]|$)/i);
}
if (canSpeak) { pickVoices(); speechSynthesis.addEventListener?.("voiceschanged", pickVoices); }
let speaking = false, speakToken = 0;
function stopSpeaking() { speakToken++; if (canSpeak) speechSynthesis.cancel(); speaking = false; }
function speak(text, lang) {
  stopSpeaking();
  if (!canSpeak || !text) return Promise.resolve();
  if ((lang === "th" ? !thVoice : !koVoice) && speechSynthesis.getVoices().length && !speak.warned) {   // the whole point is hearing the other language: say so if the voice is missing
    speak.warned = true;
    toast(lang === "th" ? "이 기기에 태국어 음성이 없어 소리가 안 날 수 있어요. 설정 → 음성(언어)에서 태국어를 추가해 주세요." : "이 기기에 한국어 음성이 없어 소리가 안 날 수 있어요.");
  }
  const my = speakToken; speaking = true; updateListening();
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    const v = lang === "ko" ? koVoice : thVoice;
    u.lang = v?.lang || (lang === "ko" ? "ko-KR" : "th-TH"); if (v) u.voice = v;
    u.rate = lang === "ko" ? Math.min(1.1, settings.rate + 0.1) : settings.rate;
    const done = () => { clearTimeout(guard); if (my === speakToken) speaking = false; setTimeout(() => { updateListening(); res(); }, 350); };   // short gap so the mic does not hear the phone's own voice
    const guard = setTimeout(done, 5000 + text.length * 260);
    u.onend = u.onerror = done;
    speechSynthesis.speak(u);
  });
}

// ---------- microphone + voice activity detection ----------
// The phone listens all the time; when someone talks it records until a short silence, then sends that clip to Gemini,
// which hears whether it was Korean or Thai and translates it. While translating or reading aloud, listening pauses.
// amb: how far above the measured room sound (TV etc., "주변 소리 재기") a voice must be; minVoice: shortest speech that counts
const SENS = { near: { mult: 5, floor: 0.04, amb: 3.5, minVoice: 500 }, low: { mult: 4, floor: 0.02, amb: 2.5, minVoice: 400 },

    el("div", { class: "row" }, el("button", { class: "btn", type: "button", text: "대화 기록 지우기", onclick: () => { if (confirm("통역 기록을 모두 지울까요?")) { log = []; saveLog(); renderList(); } } })),
    el("div", { class: "help", text: "무료 사용량에는 분당·하루 횟수 제한이 있어요. 말 한 번이 한 번으로 세어져요. 한도에 걸리면 잠시 기다리거나 'lite' 모델로 바꿔 주세요." }));
}
$("btnSet").onclick = () => {
  const s = $("settings"), on = s.hidden; s.hidden = !on; $("btnSet").setAttribute("aria-pressed", String(on));
  if (on) { renderSettings(); $("main").scrollTop = 0; }
};

// ---------- start ----------
renderList();
setMode(settings.mode === "btn" ? "btn" : "auto");
if (!apiKey) showSetup(true);
if (!window.isSecureContext && location.protocol !== "file:") setStatus("마이크를 쓰려면 https 주소로 열어야 해요");
</script>
</body>
