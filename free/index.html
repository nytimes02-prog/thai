<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7259">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>พูดเลย 태국어 회화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone-first app — header with tabs, scrolling chat, composer (with voice panel) at the bottom of the flex column. */
:root {
  --bg: #EFF4F1; --surface: #FFFFFF; --surface-2: #E3ECE7; --ink: #14211D; --muted: #5A6B65; --line: #D2DED8;
  --jade: #0B7259; --jade-ink: #FFFFFF; --jade-soft: #D8EEE6;
  --pink: #C93370; --pink-soft: #FBE3EC; --pink-ink: #5C1231;
  --t-mid: #66788A; --t-low: #2A64CC; --t-fall: #CC4122; --t-high: #198A4A; --t-rise: #8045CF;
  --warn-bg: #FFF2CF; --warn-ink: #6E4B00;
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-thai: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  --f-ko: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0D1513; --surface: #16201D; --surface-2: #1E2B27; --ink: #E4EDEA; --muted: #92A59F; --line: #2A3934;
  --jade: #3DC49E; --jade-ink: #052019; --jade-soft: #173A30;
  --pink: #F06C9F; --pink-soft: #3A1B28; --pink-ink: #FFD6E5;
  --t-mid: #9CADBA; --t-low: #73A2FF; --t-fall: #FF7C5E; --t-high: #4FD08A; --t-rise: #BA94FF;
  --warn-bg: #3A2E0E; --warn-ink: #F5D27A; color-scheme: dark;
} }
html, body { height: 100%; margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ko); font-size: 15px; line-height: 1.5; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
[lang="th"] { font-family: var(--f-thai); }

#app { height: 100%; display: flex; flex-direction: column; }
header { background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
.bar { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0; }
.brand b { font-family: var(--f-display); font-size: 22px; font-weight: 700; color: var(--jade); }
.brand span { color: var(--muted); font-size: 13px; white-space: nowrap; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 500; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--jade); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.badge { background: var(--pink); color: #fff; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 0 6px; line-height: 18px; min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn[aria-pressed="true"] { background: var(--jade); border-color: var(--jade); color: var(--jade-ink); }

main { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.view { padding-block: 16px 24px; display: flex; flex-direction: column; gap: 16px; }
.notice { background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.onboard { background: var(--surface); border: 2px solid var(--jade); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.onboard ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
.onboard a { color: var(--jade); font-weight: 600; }
.keyrow { display: flex; gap: 8px; flex-wrap: wrap; }
.keyrow input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg); font-family: ui-monospace, monospace; font-size: 14px; }
.ok { color: var(--jade); font-size: 13px; font-weight: 600; }
.bad { color: var(--pink); font-size: 13px; font-weight: 600; }

.scen-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
h2 { font-family: var(--f-display); font-size: 18px; margin: 0; text-wrap: balance; }
.scen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.scen { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; transition: border-color .15s, transform .1s; }
.scen:hover { border-color: var(--jade); }
.scen:active { transform: scale(.97); }
.scen .th { font-family: var(--f-thai); font-size: 18px; font-weight: 600; }
.scen .ko { font-size: 13px; color: var(--muted); }
.scene-bar { display: flex; gap: 10px; align-items: center; background: var(--jade-soft); border-radius: var(--r); padding: 10px 12px; }
.scene-bar .txt { flex: 1; min-width: 0; }
.scene-bar .t1 { font-weight: 600; }
.scene-bar .t1 [lang="th"] { margin-right: 6px; }
.scene-bar .t2 { font-size: 13px; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn.primary { background: var(--jade); border-color: var(--jade); color: var(--jade-ink); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: default; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend svg { width: 18px; height: 12px; }

.chat { display: flex; flex-direction: column; gap: 14px; }
.example-cap { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .06em; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--muted); }
.msg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.who { font-size: 12px; color: var(--muted); font-weight: 500; }
.ai-card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px var(--r) var(--r) var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.me { align-items: flex-end; }
.me-bubble { background: var(--pink-soft); color: var(--pink-ink); border-radius: var(--r) 4px var(--r) var(--r); padding: 9px 14px; max-width: 88%; white-space: pre-wrap; overflow-wrap: anywhere; }
.fb { align-self: stretch; border: 1px dashed var(--pink); border-radius: var(--r); padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.fb-title { font-size: 13px; font-weight: 600; color: var(--pink); }
.fb-note { font-size: 14px; }
.fb-alt-title { font-size: 12px; color: var(--muted); font-weight: 600; }
.coach { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
.coach b { color: var(--jade); font-weight: 600; }
.sent { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sent + .sent { border-top: 1px solid var(--line); padding-top: 10px; }
.th-row { display: flex; gap: 8px; align-items: flex-start; }
.th-text { font-family: var(--f-thai); font-size: 21px; line-height: 1.55; font-weight: 500; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mini { border: 0; background: var(--surface-2); width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex: none; color: var(--ink); }
.mini svg { width: 16px; height: 16px; }
.mini.on { color: var(--pink); }
.mini.speaking { background: var(--jade); color: var(--jade-ink); }
.syls { display: flex; flex-wrap: wrap; gap: 4px; }
.syl { border: 0; background: transparent; padding: 2px 6px 3px; border-radius: 8px; display: inline-flex; flex-direction: column; align-items: center; line-height: 1.2; border-bottom: 3px solid currentColor; }
.syl:hover { background: var(--surface-2); }
.syl .s-th { font-family: var(--f-thai); font-size: 15px; color: var(--ink); }
.syl .s-r { font-size: 12px; display: inline-flex; align-items: center; gap: 2px; }
.syl svg { width: 14px; height: 10px; }
.t-mid { color: var(--t-mid); } .t-low { color: var(--t-low); } .t-falling { color: var(--t-fall); } .t-high { color: var(--t-high); } .t-rising { color: var(--t-rise); }
.pron { font-size: 15px; font-weight: 500; }
.roman { font-size: 14px; color: var(--muted); font-style: italic; }
.mean { font-size: 14px; color: var(--muted); }
.mean::before { content: "뜻 "; font-size: 11px; font-weight: 600; color: var(--jade); margin-right: 2px; }
.typing { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); font-size: 14px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
.err { background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.composer { flex: none; background: var(--surface); border-top: 1px solid var(--line); }
.composer > .wrap { padding-block: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
.hints { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.hints::-webkit-scrollbar { display: none; }
.hint { flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 5px 10px; text-align: left; max-width: 260px; display: flex; flex-direction: column; }
.hint .h-th { font-family: var(--f-thai); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hint .h-ko { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hints-label { font-size: 12px; color: var(--muted); flex: none; align-self: center; }
.row { display: flex; gap: 8px; align-items: flex-end; }
#input { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; background: var(--bg); max-height: 140px; line-height: 1.45; font-family: var(--f-ko), var(--f-thai); font-size: 16px; }
#input:focus { outline: none; border-color: var(--jade); }
.send { background: var(--jade); color: var(--jade-ink); border: 0; border-radius: 12px; height: 42px; padding: 0 16px; font-weight: 600; flex: none; }
.send:disabled { opacity: .5; cursor: default; }
.mic { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; position: relative; }
.mic svg { width: 20px; height: 20px; }
.mic.live { background: var(--pink); border-color: var(--pink); color: #fff; }
.mic-lang { position: absolute; bottom: -2px; right: -4px; font-size: 9px; font-weight: 700; background: var(--ink); color: var(--bg); border-radius: 4px; padding: 0 3px; line-height: 13px; }
.partial { font-size: 13px; color: var(--muted); font-style: italic; }
.voice-toggle { height: 42px; border-radius: 12px; border: 1px solid var(--jade); background: var(--surface); color: var(--jade); font-weight: 600; padding: 0 10px; flex: none; display: flex; align-items: center; gap: 4px; font-size: 13px; }
.voice-toggle svg { width: 18px; height: 18px; }

/* voice panel */
.voice { background: var(--jade-soft); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.v-top { display: flex; align-items: center; gap: 12px; }
.v-big { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--jade); color: var(--jade-ink); display: grid; place-items: center; flex: none; position: relative; }
.v-big svg { width: 28px; height: 28px; }
.v-big.listening { background: var(--pink); color: #fff; }
.v-big.listening::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--pink); opacity: .5; animation: pulse 1.4s infinite; }
@keyframes pulse { 0% { transform: scale(.9); opacity: .6 } 100% { transform: scale(1.15); opacity: 0 } }
.v-status { flex: 1; min-width: 0; }
.v-status b { display: block; font-size: 16px; }
.v-status span { font-size: 13px; color: var(--muted); display: block; overflow-wrap: anywhere; }
.v-opts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--jade); color: var(--jade-ink); border-color: var(--jade); }
.v-off { margin-left: auto; border: 1px solid var(--pink); color: var(--pink); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; }

.settings { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--jade); color: var(--jade-ink); border-color: var(--jade); }
.help { font-size: 12px; color: var(--muted); }
select { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--bg); max-width: 100%; }
input[type="range"] { accent-color: var(--jade); width: 100%; max-width: 320px; }

.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; display: flex; flex-direction: column; min-width: 90px; }
.stat b { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; min-height: 230px; justify-content: center; }
.card .front-ko { font-size: 20px; font-weight: 600; }
.card .front-th { font-family: var(--f-thai); font-size: 28px; font-weight: 500; }
.card .sent { align-items: center; text-align: center; width: 100%; }
.card .th-row { justify-content: center; }
.card .th-text { flex: none; }
.card .syls { justify-content: center; }
.card-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.qmeta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; }
.item .body { flex: 1; min-width: 0; }
.item .i-th { font-family: var(--f-thai); font-size: 18px; overflow-wrap: anywhere; }
.item .i-sub { font-size: 13px; color: var(--muted); }
.item .i-acts { display: flex; gap: 4px; flex: none; }
.del.confirm { background: var(--pink); color: #fff; width: auto; padding: 0 8px; font-size: 12px; }
#search { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface); width: 100%; }
.empty { color: var(--muted); font-size: 14px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 18px; text-align: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(130px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
@media (max-width: 480px) { .brand span { display: none; } .th-text { font-size: 19px; } .tabs button { padding: 6px 10px; } .voice-toggle span { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="wrap bar">
      <div class="brand"><b lang="th">พูดเลย</b><span>태국어 회화 · 무료판</span></div>
      <div class="tabs" role="tablist">
        <button id="tab-talk" role="tab" aria-selected="true">회화</button>
        <button id="tab-review" role="tab" aria-selected="false">복습 <span class="badge" id="due-badge" hidden>0</span></button>
      </div>
      <button class="icon-btn" id="btn-awake" aria-pressed="false" aria-label="화면 켜두기" title="화면 켜두기" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="설정" title="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="wrap">
      <section class="view" id="view-settings" hidden></section>
      <section class="view" id="view-talk"></section>
      <section class="view" id="view-review" hidden></section>
    </div>
  </main>

  <div class="composer" id="composer">
    <div class="wrap">
      <div class="voice" id="voice" hidden>
        <div class="v-top">
          <button class="v-big" id="v-big" aria-label="말하기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <div class="v-status" aria-live="polite"><b id="v-state">눌러서 말하세요</b><span id="v-sub"></span></div>
        </div>
        <div class="v-opts" id="v-opts"></div>
      </div>
      <div class="hints" id="hints" hidden></div>
      <div class="partial" id="partial" hidden></div>
      <div class="row">
        <button class="voice-toggle" id="voice-toggle" title="음성 대화 모드">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg><span>음성 대화</span>
        </button>
        <button class="mic" id="mic" aria-label="말로 입력" title="말로 입력" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <span class="mic-lang" id="mic-lang">TH</span>
        </button>
        <textarea id="input" rows="1" placeholder="태국어나 한국어로 써 보세요"></textarea>
        <button class="send" id="send">보내기</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

// ---------- data ----------
const SCENARIOS = [
  { id: "greet", th: "ทักทาย", ko: "인사·자기소개", who: "카페에서 만난 태국 친구", ai: "f",
    role: "A friendly Thai woman (about 30) meeting the learner at a café in Bangkok. Small talk: names, where they are from, job, how long they have been in Thailand, hobbies." },
  { id: "food", th: "สั่งอาหาร", ko: "식당 주문", who: "식당 직원", ai: "f",

  if (queue) { v.append(el("div", { class: "empty", text: "오늘 복습을 다 했어요. 수고했어요!" })); queue = null; }
  if (all.length) {
    v.append(el("div", { class: "scen-head" }, el("h2", { text: "카드 복습" }),
      el("div", { class: "seg" },
        el("button", { "aria-pressed": settings.dir === "ko2th", text: "한국어 → 태국어", onclick: () => { settings.dir = "ko2th"; saveSettings(); renderReview(); } }),
        el("button", { "aria-pressed": settings.dir === "th2ko", text: "태국어 → 한국어", onclick: () => { settings.dir = "th2ko"; saveSettings(); renderReview(); } }))));
    v.append(el("div", { class: "card-actions", style: "justify-content:flex-start" },
      el("button", { class: "btn primary", text: due.length ? `복습 시작 (${due.length}개)` : "복습할 표현이 없어요", disabled: !due.length || null, onclick: () => { queue = dueList(); qIndex = 0; revealed = false; renderReview(); } }),
      el("button", { class: "btn", text: "전체 섞어서 복습", onclick: () => { queue = [...all].sort(() => Math.random() - 0.5); qIndex = 0; revealed = false; renderReview(); } })));
  }
  v.append(el("h2", { text: "저장한 표현" }));
  if (!all.length) { v.append(el("div", { class: "empty", text: "대화 중 문장 옆의 별을 누르면 여기에 모여요." })); return; }
  const search = el("input", { id: "search", type: "search", placeholder: "태국어, 발음, 뜻으로 찾기", value: v.dataset.q || "" });
  const list = el("div", { class: "list" });
  const draw = () => {
    const q = search.value.trim().toLowerCase(); list.replaceChildren();
    for (const p of all) {
      if (q && ![p.th, p.pron, p.roman, p.ko].some(x => String(x || "").toLowerCase().includes(q))) continue;
      const play = el("button", { class: "mini", "aria-label": "듣기" }, icoPlay()); play.onclick = () => speak(p.th, play);
      const del = el("button", { class: "mini del" + (delArm === p.id ? " confirm" : ""), "aria-label": "삭제" }, delArm === p.id ? "삭제" : icoTrash());
      del.onclick = () => { if (delArm === p.id) { delArm = null; phrases.delete(p.id); savePhrases(); refreshPhraseUI(); } else { delArm = p.id; draw(); } };
      list.append(el("div", { class: "item" }, el("div", { class: "body" }, el("div", { class: "i-th", lang: "th", text: p.th }),
        el("div", { class: "i-sub", text: [settings.pron === "roman" ? p.roman : p.pron, p.ko].filter(Boolean).join(" · ") })), el("div", { class: "i-acts" }, play, del)));
    }
    if (!list.children.length) list.append(el("div", { class: "empty", text: "찾는 표현이 없어요." }));
  };
  search.addEventListener("input", () => { v.dataset.q = search.value; draw(); });
  v.append(search, list); draw();
}

// ---------- settings ----------
function seg(key, options, after) {
  return el("div", { class: "seg" }, options.map(([val, label]) => el("button", { "aria-pressed": settings[key] === val, text: label,
    onclick: () => { settings[key] = val; saveSettings(); after?.(); renderSettings(); } })));
}
function renderSettings() {
  const v = $("view-settings"); v.replaceChildren();
  const voiceNote = thVoice ? `태국어 음성: ${thVoice.name}` : "이 기기에서 태국어 음성을 찾지 못했어요. Windows는 설정 → 시간 및 언어 → 음성 → 음성 추가에서 '태국어'를 설치한 뒤 브라우저를 다시 열어 주세요. 안드로이드는 설정 → 'Google 음성 서비스' → 음성 데이터에서 태국어를 받을 수 있어요. 아이폰은 설정 → 손쉬운 사용 → 읽기 및 말하기 → 음성 → 태국어.";
  const rate = el("input", { type: "range", id: "rate", min: "0.5", max: "1.2", step: "0.05", value: settings.rate });
  const rateVal = el("span", { text: " " + Number(settings.rate).toFixed(2) + "배" });
  rate.addEventListener("input", () => { settings.rate = Number(rate.value); rateVal.textContent = " " + settings.rate.toFixed(2) + "배"; saveSettings(); });
  const modelSel = el("select", { id: "model" }, (models.length ? models : [settings.model || "gemini-flash-latest"]).map(m => el("option", { value: m, text: m + (/lite/.test(m) ? " (가볍고 빠름)" : "") })));
  modelSel.value = settings.model || defaultModel(models);
  modelSel.onchange = () => { settings.model = modelSel.value; saveSettings(); toast("모델을 바꿨어요"); };
  v.append(el("div", { class: "scen-head" }, el("h2", { text: "설정" }), el("button", { class: "btn", text: "닫기", onclick: () => setView("talk") })),
    el("div", { class: "settings" },
      el("div", { class: "field" }, el("div", { class: "lbl", text: "무료 AI 키 (Google Gemini)" }), keyBox(true),
        el("div", { class: "help" }, "키는 ", el("a", { href: "https://aistudio.google.com/app/apikey", target: "_blank", rel: "noopener", text: "Google AI Studio" }), "에서 무료로 만들 수 있어요. 이 기기에만 저장돼요. 다른 기기에서는 그 기기에서 한 번 더 넣어 주세요.")),
      el("div", { class: "field" }, el("label", { for: "model", text: "AI 모델" }), modelSel,
        el("div", { class: "help", text: "한도에 자주 걸리면 'lite'가 붙은 모델로 바꿔 보세요. 대신 성조·교정이 조금 덜 정확할 수 있어요." })),
      el("div", { class: "field" }, el("div", { class: "lbl", text: "나는" }), seg("gender", [["m", "남성 · ผม / ครับ"], ["f", "여성 · ฉัน / ค่ะ"]]),
        el("div", { class: "help", text: "태국어는 말하는 사람의 성별에 따라 문장 끝 말이 달라요." })),
      el("div", { class: "field" }, el("div", { class: "lbl", text: "난이도" }), seg("level", Object.entries(LEVELS).map(([k, x]) => [k, x.ko]))),
      el("div", { class: "field" }, el("div", { class: "lbl", text: "발음 표기" }), seg("pron", [["both", "한글 + 로마자"], ["ko", "한글만"], ["roman", "로마자만"]])),
      el("div", { class: "field" }, el("div", { class: "lbl", text: "음절별 성조 표시" }), seg("tones", [[true, "보이기"], [false, "숨기기"]]), legend()),
      el("div", { class: "field" }, el("label", { for: "rate", text: "태국어 읽기 속도" }), el("div", null, rate, rateVal),
        el("div", { class: "help", text: voiceNote }),
        el("div", null, el("button", { class: "btn", text: "들어 보기", onclick: (e) => speak("สวัสดีครับ ยินดีที่ได้รู้จัก", e.currentTarget) }))),
      el("div", { class: "field" }, el("div", { class: "lbl", text: "음성 대화" }),
        el("div", { class: "help", text: SR
          ? "아래쪽 '음성 대화'를 누르면 말로 주고받아요. 처음에 마이크 권한을 물으면 꼭 '허용'을 눌러 주세요. 거절했다면 주소창 왼쪽 자물쇠(아이폰은 aA) → 마이크 → 허용으로 바꿔요. 음성 인식은 인터넷이 연결돼 있어야 해요."
          : "이 브라우저는 음성 인식을 지원하지 않아요(예: 파이어폭스, 일부 앱 안 브라우저). 크롬·엣지·사파리로 열거나, 키보드의 마이크 버튼으로 말해서 입력하세요. 대답 읽어 주기는 그대로 돼요." })),
      el("div", { class: "field" }, el("div", { class: "lbl", text: "화면 켜두기" }),
        canWake ? seg("keepAwake", [[true, "켜기"], [false, "끄기"]], applyWake) : null,
        el("div", { class: "help", text: canWake
          ? "켜 두면 이 페이지를 보는 동안 화면이 꺼지지 않아요. 내가 '끄기'나 위쪽 전구 버튼을 누를 때만 꺼져요. 다른 앱으로 가면 잠깐 풀렸다가, 돌아오면 다시 켜져요."
          : "이 브라우저에서는 화면 켜두기를 쓸 수 없어요. 휴대폰 설정에서 화면 꺼짐 시간을 늘려 주세요." })),
      el("div", { class: "field" }, el("div", { class: "lbl", text: "저장 위치" }),
        el("div", { class: "help", text: "대화와 저장한 표현은 이 기기 브라우저에 저장돼요. 브라우저 기록(사이트 데이터)을 지우면 함께 지워져요." }))));
}

// ---------- mic (dictation into the box) ----------
function updateMic() { $("mic").hidden = !SR || view !== "talk" || voiceOn; $("mic-lang").textContent = settings.micLang === "th" ? "TH" : "KO"; }
$("mic").addEventListener("click", () => { if (rec) { rec.stop(); return; } startRec("dictate"); });
$("mic").addEventListener("contextmenu", (e) => { e.preventDefault(); setMicLang(settings.micLang === "th" ? "ko" : "th"); toast(settings.micLang === "th" ? "태국어로 들어요" : "한국어로 들어요"); });
$("mic-lang").addEventListener("click", (e) => { e.stopPropagation(); setMicLang(settings.micLang === "th" ? "ko" : "th"); toast(settings.micLang === "th" ? "태국어로 들어요" : "한국어로 들어요"); });

// ---------- keep screen on ----------
let wakeLock = null;
const canWake = "wakeLock" in navigator;
async function applyWake(fromUser = true) {
  if (canWake && settings.keepAwake && document.visibilityState === "visible" && !wakeLock) {
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; updateAwakeBtn(); });
      if (fromUser) toast("화면이 꺼지지 않게 켜 뒀어요. 끄려면 전구 버튼을 다시 누르세요");
    } catch { if (fromUser) toast("이 화면에서는 '화면 켜두기'를 쓸 수 없어요"); }
  }
  if (!settings.keepAwake && wakeLock) { const w = wakeLock; wakeLock = null; w.release().catch(() => {}); if (fromUser) toast("화면 켜두기를 껐어요"); }
  updateAwakeBtn();
}
function updateAwakeBtn() {
  const b = $("btn-awake"); b.hidden = !canWake;
  b.setAttribute("aria-pressed", String(!!settings.keepAwake));
  b.title = settings.keepAwake ? "화면 켜두기 켜짐 · 누르면 꺼요" : "화면 켜두기";
}
$("btn-awake").onclick = () => { settings.keepAwake = !settings.keepAwake; saveSettings(); applyWake(); if (view === "settings") renderSettings(); };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") applyWake(false); });

// ---------- shell ----------
function setView(v) {
  view = v;
  $("view-talk").hidden = v !== "talk"; $("view-review").hidden = v !== "review"; $("view-settings").hidden = v !== "settings";
  $("tab-talk").setAttribute("aria-selected", String(v === "talk")); $("tab-review").setAttribute("aria-selected", String(v === "review"));
  $("composer").hidden = v !== "talk";
  if (v === "review") { queue = null; renderReview(); }
  if (v === "settings") renderSettings();
  render(); $("main").scrollTop = 0;
}
function render() { if (view === "talk") renderTalk(); $("send").disabled = busy; updateMic(); renderHints(); }
function scrollEnd() { const m = $("main"); requestAnimationFrame(() => { m.scrollTop = m.scrollHeight; }); }
function autosize() { const b = $("input"); b.style.height = "auto"; b.style.height = Math.min(b.scrollHeight, 140) + "px"; }
$("tab-talk").onclick = () => setView("talk");
$("tab-review").onclick = () => setView("review");
$("btn-settings").onclick = () => setView(view === "settings" ? "talk" : "settings");
$("send").onclick = send;
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && matchMedia("(hover: hover)").matches) { e.preventDefault(); send(); }
});

if (conv && !scen(conv.scenario)) conv = null;
if (conv) {
  const last = conv.items[conv.items.length - 1];
  if (last?.type === "me" && last.pending) { pendingText = last.text; lastError = "대답을 받기 전에 화면이 닫혔어요. 다시 보내 주세요."; }
  else if (!conv.items.length) lastError = "대화를 시작하지 못했어요. 다시 시도해 주세요.";
}
render(); if (conv) scrollEnd();
refreshPhraseUI(); applyWake(false);
})();
</script>
